[project]
name = "enterprise-rag"
version = "0.1.0"
description = "基于企业内容知识库的政策问答系统：MySQL + Milvus + bge-m3 + DeepSeek"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "王国庆" }]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
    "pyjwt>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.27,<1",
    "pymilvus>=2.6,<2.7",
    "openai>=1.60,<2",
    "pillow>=10.4,<12",
    "pymupdf>=1.24,<2",
    "python-pptx>=1.0,<2",
    "python-docx>=1.1,<2",
    "rapidocr>=3.0,<4",
    "sentence-transformers>=3.0,<6",
    "tenacity>=9.0,<10",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要 MySQL/Milvus 的集成测试",
    "bge_m3: 需要本地 bge-m3 模型的慢测试",
    "deepseek: 需要 DEEPSEEK_API_KEY 的真实模型测试",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/enterprise_rag/api/*.py" = ["B008"]
"tests/*.py" = ["B008"]
"tests/**/*.py" = ["B008"]
